<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eeebe4">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
    <title>Offline · Dossier</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; background: light-dark(#eeebe4, #1a1917); color: light-dark(#1d1c1a, #f0ede7); }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
      main { max-width: 28rem; padding: 2rem; }
      h1 { font: 2.5rem/1.1 Georgia, serif; }
      a { display: inline-block; padding: .75rem 1.25rem; border-radius: .5rem; background: light-dark(#222, #ebe7df); color: light-dark(#fbfaf7, #1d1c1a); text-decoration: none; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p>Dossier</p>
      <h1>You're offline</h1>
      <p>Connect to the internet and make sure your Dossier server is reachable, then try again. Your profile and applications stay on your server.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
